kind = "web"
previewPath = "/extension/"
title = "Markbase Extension"
version = "1.0.0"
id = "artifacts/browser-extension"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/extension/" ]
localPort = 26191

[services.development]
run = "pnpm --filter @workspace/browser-extension run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/browser-extension", "run", "build" ]
publicDir = "artifacts/browser-extension/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26191"
BASE_PATH = "/extension/"
